services:
  projects-api:
    build:
      context: ./src/Projects.Api
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    environment:
      - CosmosDb__Endpoint=${COSMOS_ENDPOINT}
      - CosmosDb__Key=${COSMOS_KEY}
      - CosmosDb__DatabaseName=TaskBoard

  tasks-api:
    build:
      context: ./src/Task.Api
      dockerfile: Dockerfile
    ports:
      - "5002:8080"
    environment:
      - CosmosDb__Endpoint=${COSMOS_ENDPOINT}
      - CosmosDb__Key=${COSMOS_KEY}
      - CosmosDb__DatabaseName=TaskBoard
      - ProjectsApi__BaseUrl=http://projects-api:8080
    depends_on:
      - projects-api